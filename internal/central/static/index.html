<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RP Console</title>
  <style nonce="{{NONCE}}">
    :root{--ink:#17212b;--muted:#67737e;--line:#dfe5e9;--panel:#fff;--accent:#0f766e;--accent-hover:#0b625c;--danger:#c0392b;--danger-hover:#a82f25;--ok:#16803c;--warn:#bd7a00}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;background:#eef2f3}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1480px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:20px;font-weight:750;white-space:nowrap}.version{margin-left:7px;color:var(--muted);font-size:12px;font-weight:600;vertical-align:middle}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}.actions,.filters{display:flex;gap:8px;align-items:center;flex:0 0 auto}.top .actions{white-space:nowrap}.button,.icon-button{border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);transition:background-color 100ms ease,border-color 100ms ease,box-shadow 100ms ease,filter 80ms ease}.button{padding:9px 12px}.button:hover:not(:disabled),.icon-button:hover:not(:disabled){background:#edf3f4;border-color:#aababe}.button:active:not(:disabled),.icon-button:active:not(:disabled){filter:brightness(.96);box-shadow:inset 0 1px 2px rgba(12,32,40,.2)}.button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.button.primary:hover:not(:disabled){border-color:var(--accent-hover);background:var(--accent-hover)}.button.danger{border-color:#e9b5ae;color:var(--danger)}.button.danger:hover:not(:disabled){background:#fff0ee;border-color:#d88c82;color:var(--danger-hover)}.button.danger.primary{border-color:var(--danger);background:var(--danger);color:#fff}.button:disabled,.icon-button:disabled{cursor:not-allowed;opacity:.5}.button:focus-visible,.icon-button:focus-visible,.name-link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(15,118,110,.3);outline-offset:2px}.icon-button{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-size:16px;line-height:1}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line)}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:28px;line-height:1.15}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h1,.panel-head h2{font-size:15px;margin:0}.filters input{width:220px;border:1px solid var(--line);border-radius:5px;padding:7px 9px}.notice{margin:0 0 16px;padding:10px 12px;border:1px solid #e9b5ae;background:#fff0ee;color:var(--danger)}.table-wrap{overflow:auto}.server-table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:fixed}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;background:#fafcfc;position:relative;white-space:nowrap}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis}tr:last-child td{border-bottom:0}.select-cell{width:38px;text-align:center}.select-cell input{width:16px;height:16px;margin:0;accent-color:var(--accent)}.column-resizer{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;touch-action:none;z-index:2}.column-resizer::after{content:"";position:absolute;top:18%;bottom:18%;left:4px;width:1px;background:#b5c0c5;transition:background-color 120ms ease,width 120ms ease}.column-resizer:hover::after,.column-resizer.dragging::after{background:var(--accent);width:2px}.column-resizer:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.is-resizing{cursor:col-resize;user-select:none}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#99a5ad}.dot.green{background:var(--ok);box-shadow:0 0 0 3px #e4f5e8}.dot.yellow{background:#e3a008;box-shadow:0 0 0 3px #fff3d1}.dot.red{background:var(--danger);box-shadow:0 0 0 3px #fde7e4}.name-link{border:0;background:transparent;color:#126b88;padding:0;font-weight:650;text-align:left;text-decoration:none}.name-link:hover{text-decoration:underline;color:#0d566e}.name-link.unavailable{color:var(--muted);cursor:not-allowed}.validity{white-space:nowrap;font-variant-numeric:tabular-nums}.validity div+div{margin-top:2px}.address{font:14px/1.45 Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}.muted{color:var(--muted)}.events{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.event-list{padding:0 16px}.event{padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event time{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#edf1f2;color:#41505b}.badge.error{background:#fde8e6;color:#9d2d20}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(380px,100%);background:#fff;border:1px solid var(--line);padding:28px}.login-card h1{margin:0 0 5px;font-size:21px}.login-card p{margin:0 0 20px;color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px}.error{color:var(--danger);min-height:20px;margin-top:8px}.modal{position:fixed;z-index:1000;inset:0;background:rgba(20,32,40,.4);display:grid;place-items:center;padding:20px}.modal-card{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0;font-size:17px}.modal-list{margin:12px 0;padding-left:20px}.modal-list li+li{margin-top:4px}.note{font-size:12px;color:var(--muted);margin:8px 0 0}.empty{padding:44px;text-align:center;color:var(--muted)}.shell[inert]{pointer-events:none;user-select:none}@media(max-width:840px){.shell{padding:14px}.top{overflow-x:auto;align-items:flex-start}.top .actions{padding-bottom:2px}.stats{grid-template-columns:repeat(2,1fr)}.events{grid-template-columns:1fr}.panel-head{align-items:flex-start;flex-direction:column}.filters{width:100%;overflow-x:auto}.filters input{flex:1 0 210px}.form-grid{grid-template-columns:1fr!important}.form-grid .wide{grid-column:auto!important}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script nonce="{{NONCE}}">
    const state={servers:[],events:[],summary:{total:0,green:0,yellow:0,red:0},site:null,operation:null,selected:new Set(),query:'',notice:''};
    const app=document.querySelector('#app');
    const columns=[
      {key:'select',label:'选择',width:38,resizable:false},
      {key:'status',label:'状态',width:34,resizable:false},
      {key:'edit',label:'设置',width:40,resizable:false},
      {key:'name',label:'名称',width:190,min:130,max:520},
      {key:'address',label:'IP / 域名',width:190,min:145,max:520},
      {key:'validity',label:'有效期',width:154,min:128,max:320},
      {key:'traffic',label:'累计流量',width:106,min:82,max:260},
      {key:'version',label:'RP版本',width:92,min:74,max:220},
      {key:'lines',label:'线路',width:70,min:52,max:180},
      {key:'abnormal',label:'异常',width:70,min:52,max:180}
    ];
    const columnStorageKey='rp-console:server-table-columns:v2';
    let columnWidths=loadColumnWidths();
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const bytes=value=>{let n=Number(value)||0;const units=['B','KB','MB','GB','TB'];let index=0;while(n>=1024&&index<units.length-1){n/=1024;index++}return index?`${n.toFixed(n>=100?0:1)} ${units[index]}`:`${n} B`};
    const validity=server=>`<div>起：${esc(server.validFrom||'-')}</div><div>止：${esc(server.validUntil||'长期')}</div>`;
    const formatTime=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'-';
    const operationActive=()=>['queued','running'].includes(state.operation?.status);
    const visibleServers=()=>state.servers.filter(server=>(server.name+' '+server.address).toLowerCase().includes(state.query.trim().toLowerCase()));
    function loadColumnWidths(){try{const saved=JSON.parse(localStorage.getItem(columnStorageKey)||'{}');return Object.fromEntries(columns.map(column=>[column.key,Number.isFinite(saved[column.key])?saved[column.key]:column.width]))}catch{return Object.fromEntries(columns.map(column=>[column.key,column.width]))}}
    function saveColumnWidths(){localStorage.setItem(columnStorageKey,JSON.stringify(columnWidths))}
    function setColumnWidth(key,width){const column=columns.find(item=>item.key===key);if(!column||column.resizable===false)return;columnWidths[key]=Math.min(column.max,Math.max(column.min,Math.round(width)));document.querySelectorAll(`[data-column-width="${key}"]`).forEach(element=>element.style.width=`${columnWidths[key]}px`)}
    async function api(url,options={}){const headers={...(options.headers||{})};if(!(options.body instanceof FormData)&&!headers['Content-Type'])headers['Content-Type']='application/json';const response=await fetch(url,{...options,headers});if(response.status===401)throw new Error('LOGIN_REQUIRED');const raw=response.status===204?'':await response.text();let body=null;if(raw){try{body=JSON.parse(raw)}catch{throw new Error(response.ok?'服务器返回了无法识别的数据':`请求失败（HTTP ${response.status}）`)}}if(!response.ok){const error=new Error(body?.error||`请求失败（HTTP ${response.status}）`);error.response=body;throw error}return body}
    async function load(){const [data,events,site,operation]=await Promise.all([api('/api/servers'),api('/api/events'),api('/api/site'),api('/api/operations/current')]);state.servers=data.servers;state.summary=data.summary;state.events=events.events;state.site=site;state.operation=operation.operation;for(const id of [...state.selected])if(!state.servers.some(server=>server.id===id))state.selected.delete(id);render();if(operationActive()||site.job&&['queued','running'].includes(site.job.status))setTimeout(()=>load().catch(showError),1200)}
    function statusText(server){if(server.status==='red')return server.lastError||'子站运行异常';if(server.status==='yellow')return '服务器有效期不足 7 天';if(server.status==='green')return '运行正常';return '等待首次同步'}
    function columnGroup(){return `<colgroup>${columns.map(column=>`<col data-column-width="${column.key}" style="width:${columnWidths[column.key]}px">`).join('')}</colgroup>`}
    function columnHeaders(){const visible=visibleServers();const selectedCount=visible.filter(server=>state.selected.has(server.id)).length;const allSelected=visible.length>0&&selectedCount===visible.length;return columns.map(column=>`<th scope="col" data-column-width="${column.key}" style="width:${columnWidths[column.key]}px" ${['select','status','edit'].includes(column.key)?`aria-label="${column.label}"`:''}>${column.key==='select'?`<input id="select-all" type="checkbox" aria-label="全选当前搜索结果" ${allSelected?'checked':''} ${operationActive()?'disabled':''}>`:['status','edit'].includes(column.key)?'':esc(column.label)}${column.resizable!==false?`<span class="column-resizer" data-resize="${column.key}" role="separator" aria-label="调整${esc(column.label)}列宽" tabindex="0"></span>`:''}</th>`).join('')}
    function dashboard(){const busy=operationActive();const refreshLabel=busy?`刷新中 ${state.operation.completedServers}/${state.operation.totalServers}`:'刷新';return `<div class="shell"><header class="top"><div class="brand">RP Console <span class="version">v{{VERSION}}</span><small>总站：统一管理已登记的子站服务器</small></div><div class="actions"><button class="button" id="site-settings">站点设置</button><button class="button" id="refresh" ${busy?'disabled':''}>${refreshLabel}</button><button class="button primary" id="add" ${busy?'disabled':''}>添加服务器</button></div></header>${state.notice?`<div class="notice" role="alert">${esc(state.notice)}</div>`:''}<section class="stats"><div class="stat"><span>受管服务器</span><strong>${state.summary.total}</strong></div><div class="stat"><span>正常运行</span><strong>${state.summary.green}</strong></div><div class="stat"><span>运行异常</span><strong>${state.summary.red}</strong></div><div class="stat"><span>7 日内到期</span><strong>${state.summary.yellow}</strong></div></section><section class="panel"><div class="panel-head"><h1>服务器列表</h1><div class="filters"><input id="search" type="search" placeholder="搜索名称或 IP / 域名" value="${esc(state.query)}"><button class="button danger" id="delete-selected" ${state.selected.size===0||busy?'disabled':''}>删除已选（${state.selected.size}）</button></div></div><div class="table-wrap"><table class="server-table">${columnGroup()}<thead><tr>${columnHeaders()}</tr></thead><tbody id="servers-body">${rows(state.servers,busy)}</tbody></table></div></section><section class="events"><div class="panel"><div class="panel-head"><h2>待处理事项</h2></div><div class="event-list">${issues()}</div></div><div class="panel"><div class="panel-head"><h2>最近操作</h2></div><div class="event-list">${recent()}</div></div></section></div>`}
    function panelLink(server){if(!server.panelUrl)return `<span class="name-link unavailable" title="请在编辑服务器中填写可用的子站管理域名">${esc(server.name)}</span>`;return `<a class="name-link" href="${esc(server.panelUrl)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开真实子站 Relay Panel">${esc(server.name)}</a>`}
    function rows(servers,busy){if(!servers.length)return `<tr><td colspan="10"><div class="empty">暂无子站。添加服务器后，点击刷新同步子站状态和流量。</div></td></tr>`;return servers.map(server=>`<tr data-search="${esc((server.name+' '+server.address).toLowerCase())}"><td class="select-cell"><input data-select="${esc(server.id)}" type="checkbox" aria-label="选择 ${esc(server.name)}" ${state.selected.has(server.id)?'checked':''} ${busy?'disabled':''}></td><td title="${esc(statusText(server))}"><i class="dot ${esc(server.status)}"></i></td><td><button class="icon-button" data-edit="${esc(server.id)}" title="编辑服务器" aria-label="编辑服务器 ${esc(server.name)}" ${busy?'disabled':''}>&#9881;</button></td><td>${panelLink(server)}</td><td class="address" title="${esc(server.address)}">${esc(server.address)}</td><td class="validity">${validity(server)}</td><td>${bytes(server.totalTraffic)}</td><td>${esc(server.panelVersion||'-')}</td><td>${server.lineCount}</td><td>${server.abnormalCount}</td></tr>`).join('')}
    function issues(){const list=state.servers.filter(server=>server.status==='red'||server.status==='yellow');return list.length?list.map(server=>`<div class="event"><span class="badge ${server.status==='red'?'error':''}">${server.status==='red'?'异常':'到期提醒'}</span> ${esc(server.name)}<div class="muted">${esc(statusText(server))}</div></div>`).join(''):`<div class="empty">没有待处理事项</div>`}
    function recent(){return state.events.length?state.events.slice(0,6).map(event=>`<div class="event"><span class="badge ${event.level==='error'?'error':''}">${esc(event.action)}</span> ${esc(event.server)}<div class="muted">${esc(event.message)}</div><time>${formatTime(event.createdAt)}</time></div>`).join(''):`<div class="empty">暂无操作记录</div>`}
    function render(){app.innerHTML=dashboard();const search=document.querySelector('#search');search.oninput=event=>{state.query=event.target.value;applyFilter();updateSelectionControls()};document.querySelector('#site-settings').onclick=openSiteSettings;document.querySelector('#refresh').onclick=()=>startRefresh().catch(showCommandError);document.querySelector('#add').onclick=()=>openForm();document.querySelector('#delete-selected').onclick=()=>openDeleteFirst();document.querySelector('#servers-body').onclick=event=>{const id=event.target.closest('[data-edit]')?.dataset.edit;if(id)openForm(state.servers.find(server=>server.id===id))};document.querySelectorAll('[data-select]').forEach(input=>input.onchange=event=>{const id=event.target.dataset.select;if(event.target.checked)state.selected.add(id);else state.selected.delete(id);updateSelectionControls()});const selectAll=document.querySelector('#select-all');selectAll.onchange=event=>{for(const server of visibleServers()){if(event.target.checked)state.selected.add(server.id);else state.selected.delete(server.id)}updateSelectionControls()};attachColumnResizers();applyFilter();updateSelectionControls()}
    function applyFilter(){const query=state.query.trim().toLowerCase();document.querySelectorAll('#servers-body tr[data-search]').forEach(row=>row.hidden=!!query&&!row.dataset.search.includes(query))}
    function updateSelectionControls(){const visible=visibleServers();const selectedVisible=visible.filter(server=>state.selected.has(server.id)).length;const selectAll=document.querySelector('#select-all');if(selectAll){selectAll.checked=visible.length>0&&selectedVisible===visible.length;selectAll.indeterminate=selectedVisible>0&&selectedVisible<visible.length}const remove=document.querySelector('#delete-selected');if(remove){remove.textContent=`删除已选（${state.selected.size}）`;remove.disabled=state.selected.size===0||operationActive()}}
    function attachColumnResizers(){document.querySelectorAll('[data-resize]').forEach(handle=>{const key=handle.dataset.resize;const column=columns.find(item=>item.key===key);const start=event=>{event.preventDefault();const initialX=event.clientX;const initialWidth=columnWidths[key];handle.classList.add('dragging');document.body.classList.add('is-resizing');const move=moveEvent=>setColumnWidth(key,initialWidth+moveEvent.clientX-initialX);const end=()=>{handle.classList.remove('dragging');document.body.classList.remove('is-resizing');saveColumnWidths();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})};handle.addEventListener('pointerdown',start);handle.addEventListener('dblclick',()=>{setColumnWidth(key,column.width);saveColumnWidths()});handle.addEventListener('keydown',event=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;event.preventDefault();setColumnWidth(key,columnWidths[key]+(event.key==='ArrowLeft'?-12:12));saveColumnWidths()})})}
    async function startRefresh(){state.notice='';const result=await api('/api/operations/refresh',{method:'POST',body:'{}'});state.operation=result.operation;await load()}
    function openModal(content,trigger){const shell=document.querySelector('.shell');if(shell){shell.inert=true;shell.classList.add('is-modal-open')}app.insertAdjacentHTML('beforeend',content);const modal=app.lastElementChild;const close=()=>{if(shell){shell.inert=false;shell.classList.remove('is-modal-open')}modal.remove();trigger?.focus()};modal.querySelectorAll('[data-close-modal]').forEach(button=>button.onclick=close);setTimeout(()=>modal.querySelector('input,button,select')?.focus(),0);return {modal,close}}
    function form(server){const value=server||{scheme:'https',port:2083,basePath:'',validFrom:new Date().toISOString().slice(0,10),validUntil:''};return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="server-form-title"><form class="modal-card" id="server-form"><div class="modal-head"><h2 id="server-form-title">${server?'编辑服务器':'添加服务器'}</h2><button class="button" type="button" data-close-modal>关闭</button></div><p class="note">总站只保存服务器有效期用于提醒，不会下发或控制子站线路。总站只读令牌会以 AES-GCM 加密保存，列表不会回显。</p><div class="form-grid"><label class="field"><span>名称</span><input name="name" required maxlength="80" value="${esc(value.name||'')}"></label><label class="field"><span>子站管理域名</span><input name="address" required placeholder="rp2.example.com" value="${esc(value.address||'')}"></label><label class="field"><span>协议</span><select name="scheme"><option value="https">HTTPS</option></select></label><label class="field"><span>端口</span><input name="port" required type="number" min="1" max="65535" value="${esc(value.port)}"></label><label class="field wide"><span>管理基础路径</span><input name="basePath" placeholder="例如 /随机管理路径" value="${esc(value.basePath||'')}"></label><label class="field"><span>有效期起</span><input name="validFrom" required type="date" value="${esc(value.validFrom||'')}"></label><label class="field"><span>有效期止</span><input name="validUntil" type="date" value="${esc(value.validUntil||'')}"><span class="note">留空代表长期，仅用于总站提醒。</span></label><label class="field wide"><span>${server?'替换总站只读令牌（留空保持原值）':'子站总站只读令牌'}</span><input name="apiToken" ${server?'':'required'} type="password" autocomplete="new-password"></label></div><div class="error" id="form-error"></div><div class="actions"><button class="button primary" type="submit">保存</button></div></form></div>`}
    function openForm(server){const trigger=document.activeElement;const {modal,close}=openModal(form(server),trigger);modal.querySelector('#server-form').onsubmit=async event=>{event.preventDefault();const input=Object.fromEntries(new FormData(event.currentTarget).entries());input.port=Number(input.port);try{await api(server?`/api/servers/${server.id}`:'/api/servers',{method:server?'PATCH':'POST',body:JSON.stringify(input)});close();await load()}catch(error){modal.querySelector('#form-error').textContent=error.message}}}
    function openDeleteFirst(){const servers=state.servers.filter(server=>state.selected.has(server.id));const trigger=document.activeElement;const list=servers.map(server=>`<li>${esc(server.name)}</li>`).join('');const {modal,close}=openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-first-title"><div class="modal-card"><div class="modal-head"><h2 id="delete-first-title">确认删除服务器登记</h2><button class="button" data-close-modal>关闭</button></div><p>将从 RP Console 删除以下 ${servers.length} 台服务器的登记信息：</p><ul class="modal-list">${list}</ul><p class="note">不会删除子站 RP，不会停止任何线路。</p><div class="actions"><button class="button" data-close-modal>取消</button><button class="button danger primary" id="prepare-delete">继续删除</button></div></div></div>`,trigger);modal.querySelector('#prepare-delete').onclick=async()=>{try{const result=await api('/api/servers/delete-preparation',{method:'POST',body:JSON.stringify({ids:servers.map(server=>server.id)})});close();openDeleteSecond(result,trigger)}catch(error){modal.querySelector('.note').textContent=error.message}}}
    function openDeleteSecond(result,trigger){const list=result.servers.map(server=>`<li>${esc(server.name)}</li>`).join('');const {modal,close}=openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-second-title"><div class="modal-card"><div class="modal-head"><h2 id="delete-second-title">再次确认删除</h2><button class="button" data-close-modal>关闭</button></div><p>总站保存的接入令牌将一并移除，之后总站无法继续访问以下 ${result.servers.length} 台子站：</p><ul class="modal-list">${list}</ul><div class="error" id="delete-error"></div><div class="actions"><button class="button" data-close-modal>取消</button><button class="button danger primary" id="confirm-delete">确认删除 ${result.servers.length} 台服务器</button></div></div></div>`,trigger);modal.querySelector('#confirm-delete').onclick=async()=>{try{const button=modal.querySelector('#confirm-delete');button.disabled=true;await api('/api/servers',{method:'DELETE',body:JSON.stringify({ids:result.servers.map(server=>server.id),confirmationId:result.confirmationId})});state.selected.clear();close();await load()}catch(error){modal.querySelector('#delete-error').textContent=error.message;modal.querySelector('#confirm-delete').disabled=false}}}
    function openSiteSettings(){const site=state.site||{};const trigger=document.activeElement;const {modal,close}=openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="site-form-title"><form class="modal-card" id="site-form"><div class="modal-head"><h2 id="site-form-title">站点设置</h2><button class="button" type="button" data-close-modal>关闭</button></div><p class="note">上传 Cloudflare Origin Certificate 后，系统会验证域名、写入本机 Nginx 配置、重载 Nginx，并确保 UFW 放行 80/443。云厂商防火墙与 Cloudflare DNS 仍需在各自控制台配置。</p><div class="form-grid"><label class="field wide"><span>总站域名</span><input name="domain" required placeholder="rpc.example.com" value="${esc(site.domain||'')}"></label><label class="field"><span>Origin Certificate</span><input name="certificate" required type="file" accept=".crt,.pem,text/plain"></label><label class="field"><span>Origin Private Key</span><input name="privateKey" required type="file" accept=".key,.pem,text/plain"></label></div><div class="note">当前证书：${site.certificateExpiry?`到期 ${esc(new Date(site.certificateExpiry).toLocaleString('zh-CN',{hour12:false}))}`:'尚未从面板应用'}${site.appliedAt?`；上次应用 ${esc(new Date(site.appliedAt).toLocaleString('zh-CN',{hour12:false}))}`:''}</div><div class="error" id="site-error"></div><div class="actions"><button class="button primary" type="submit">保存并应用</button></div></form></div>`,trigger);modal.querySelector('#site-form').onsubmit=async event=>{event.preventDefault();const button=event.currentTarget.querySelector('[type=submit]');try{button.disabled=true;await api('/api/site/apply',{method:'POST',body:new FormData(event.currentTarget)});close();await load()}catch(error){modal.querySelector('#site-error').textContent=error.message}finally{button.disabled=false}}}
    function showCommandError(error){state.notice=error.message||'请求失败';render()}
    function showError(error){app.innerHTML=`<div class="login"><div class="login-card"><h1>无法加载总站</h1><p>${esc(error.message||'请求失败')}</p><button class="button primary" id="retry">重试</button></div></div>`;document.querySelector('#retry').onclick=()=>location.reload()}
    function login(){app.innerHTML=`<div class="login"><form class="login-card" id="login"><h1>RP Console</h1><p>总站管理登录</p><label class="field"><span>管理员密码</span><input name="password" type="password" autocomplete="current-password" required autofocus></label><div class="error" id="login-error"></div><button class="button primary" type="submit">登录</button></form></div>`;document.querySelector('#login').onsubmit=async event=>{event.preventDefault();const password=new FormData(event.currentTarget).get('password');try{await api('/api/login',{method:'POST',body:JSON.stringify({password})});load()}catch(error){document.querySelector('#login-error').textContent=error.message}}}
    api('/api/session').then(load).catch(error=>error.message==='LOGIN_REQUIRED'?login():showError(error));
  </script>
</body>
</html>
