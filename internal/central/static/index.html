<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RP Console</title>
  <style nonce="{{NONCE}}">
    :root{--ink:#17212b;--muted:#67737e;--line:#dfe5e9;--soft:#f4f7f8;--panel:#fff;--accent:#0f766e;--danger:#c0392b;--warn:#bd7a00;--ok:#16803c}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;background:#eef2f3}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1480px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:20px;font-weight:750}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}.actions{display:flex;gap:8px}.button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 12px;color:var(--ink)}.button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.button.danger{border-color:#e9b5ae;color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:28px;line-height:1.15}.panel{background:var(--panel);border:1px solid var(--line)}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h1,.panel-head h2{font-size:15px;margin:0}.filters{display:flex;gap:8px}.filters input{width:210px;border:1px solid var(--line);border-radius:5px;padding:7px 9px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;background:#fafcfc}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#99a5ad}.dot.green{background:var(--ok);box-shadow:0 0 0 3px #e4f5e8}.dot.yellow{background:#e3a008;box-shadow:0 0 0 3px #fff3d1}.dot.red{background:var(--danger);box-shadow:0 0 0 3px #fde7e4}.name-link{border:0;background:transparent;color:#126b88;padding:0;font-weight:650;text-align:left}.name-link:hover{text-decoration:underline}.validity{white-space:nowrap;font-variant-numeric:tabular-nums}.validity div+div{margin-top:2px}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.muted{color:var(--muted)}.events{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.event-list{padding:0 16px}.event{padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event time{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#edf1f2;color:#41505b}.badge.error{background:#fde8e6;color:#9d2d20}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(380px,100%);background:#fff;border:1px solid var(--line);padding:28px}.login-card h1{margin:0 0 5px;font-size:21px}.login-card p{margin:0 0 20px;color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px}.error{color:var(--danger);min-height:20px;margin-top:8px}.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:rgba(20,32,40,.4);display:grid;place-items:center;padding:20px}.modal-card{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .wide{grid-column:1/-1}.note{font-size:12px;color:var(--muted);margin:8px 0 0}.empty{padding:44px;text-align:center;color:var(--muted)}.status-note{font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:840px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.events{grid-template-columns:1fr}.panel{overflow:auto}table{min-width:980px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script nonce="{{NONCE}}">
    const state={servers:[],events:[],summary:{total:0,green:0,yellow:0,red:0},editing:null};
    const app=document.querySelector('#app');
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const bytes=value=>{let n=Number(value)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return i?`${n.toFixed(n>=100?0:1)} ${u[i]}`:`${n} B`};
    const validity=s=>`<div>起：${esc(s.validFrom||'-')}</div><div>止：${esc(s.validUntil||'长期')}</div>`;
    const formatTime=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'-';
    async function api(url,options={}){const res=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(res.status===401)throw new Error('LOGIN_REQUIRED');const body=res.status===204?null:await res.json();if(!res.ok)throw new Error(body?.error||'请求失败');return body}
    async function load(){const [data,events]=await Promise.all([api('/api/servers'),api('/api/events')]);state.servers=data.servers;state.summary=data.summary;state.events=events.events;render()}
    function statusText(server){if(server.status==='red')return server.lastError||'子站运行异常';if(server.status==='yellow')return '服务器有效期不足 7 天';if(server.status==='green')return '运行正常';return '等待首次检测'}
    function dashboard(){return `<div class="shell"><header class="top"><div class="brand">RP Console<small>总站：统一管理已登记的子站服务器</small></div><div class="actions"><button class="button" id="refresh">刷新</button><button class="button primary" id="add">添加服务器</button></div></header><section class="stats"><div class="stat"><span>受管服务器</span><strong>${state.summary.total}</strong></div><div class="stat"><span>正常运行</span><strong>${state.summary.green}</strong></div><div class="stat"><span>运行异常</span><strong>${state.summary.red}</strong></div><div class="stat"><span>7 日内到期</span><strong>${state.summary.yellow}</strong></div></section><section class="panel"><div class="panel-head"><h1>服务器列表</h1><div class="filters"><input id="search" type="search" placeholder="搜索名称或 IP"></div></div><table><thead><tr><th aria-label="状态"></th><th>名称</th><th>IP</th><th>有效期</th><th>延迟</th><th>累计流量</th><th>版本</th><th>线路</th><th>异常</th></tr></thead><tbody id="servers-body">${rows(state.servers)}</tbody></table></section><section class="events"><div class="panel"><div class="panel-head"><h2>待处理事项</h2></div><div class="event-list">${issues()}</div></div><div class="panel"><div class="panel-head"><h2>最近操作</h2></div><div class="event-list">${recent()}</div></div></section></div>`}
    function rows(servers){if(!servers.length)return `<tr><td colspan="9"><div class="empty">暂无子站。添加服务器后，总站会从子站读取真实状态和线路累计流量。</div></td></tr>`;return servers.map(s=>`<tr data-search="${esc((s.name+' '+s.address).toLowerCase())}"><td title="${esc(statusText(s))}"><i class="dot ${esc(s.status)}"></i></td><td><button class="name-link" data-open="${esc(s.id)}">${esc(s.name)}</button><button class="button" style="padding:2px 5px;margin-left:6px" data-edit="${esc(s.id)}" title="编辑服务器">&#9881;</button><div class="status-note" title="${esc(statusText(s))}">${esc(statusText(s))}</div></td><td class="mono">${esc(s.address)}</td><td class="validity">${validity(s)}</td><td>${s.latencyMs?`${s.latencyMs} ms`:'-'}</td><td>${bytes(s.totalTraffic)}</td><td>${esc(s.panelVersion||'-')}</td><td>${s.lineCount}</td><td>${s.abnormalCount}</td></tr>`).join('')}
    function issues(){const list=state.servers.filter(s=>s.status==='red'||s.status==='yellow');return list.length?list.map(s=>`<div class="event"><span class="badge ${s.status==='red'?'error':''}">${s.status==='red'?'异常':'到期提醒'}</span> ${esc(s.name)}<div class="muted">${esc(statusText(s))}</div></div>`).join(''):`<div class="empty">没有待处理事项</div>`}
    function recent(){return state.events.length?state.events.slice(0,6).map(e=>`<div class="event"><span class="badge ${e.level==='error'?'error':''}">${esc(e.action)}</span> ${esc(e.server)}<div class="muted">${esc(e.message)}</div><time>${formatTime(e.createdAt)}</time></div>`).join(''):`<div class="empty">暂无操作记录</div>`}
    function form(server){const s=server||{scheme:'https',port:2053,basePath:'',validFrom:new Date().toISOString().slice(0,10),validUntil:''};return `<div class="modal" id="modal"><form class="modal-card" id="server-form"><div class="modal-head"><h2>${server?'编辑服务器':'添加服务器'}</h2><button class="button" type="button" id="close">关闭</button></div><p class="note">总站只保存服务器有效期用于提醒，不会下发或控制子站线路。总站只读令牌会以 AES-GCM 加密保存，列表不会回显。</p><div class="form-grid"><label class="field"><span>名称</span><input name="name" required maxlength="80" value="${esc(s.name||'')}"></label><label class="field"><span>管理 IP 或域名</span><input name="address" required value="${esc(s.address||'')}"></label><label class="field"><span>协议</span><select name="scheme"><option value="https">HTTPS</option></select></label><label class="field"><span>端口</span><input name="port" required type="number" min="1" max="65535" value="${esc(s.port)}"></label><label class="field wide"><span>管理基础路径</span><input name="basePath" placeholder="例如 /随机管理路径；没有则留空" value="${esc(s.basePath||'')}"></label><label class="field"><span>有效期起</span><input name="validFrom" required type="date" value="${esc(s.validFrom||'')}"></label><label class="field"><span>有效期止</span><input name="validUntil" type="date" value="${esc(s.validUntil||'')}"><span class="note">留空代表长期，仅用于总站提醒。</span></label><label class="field wide"><span>${server?'替换总站只读令牌（留空保持原值）':'子站总站只读令牌'}</span><input name="apiToken" ${server?'':'required'} type="password" autocomplete="new-password"></label></div><div class="error" id="form-error"></div><div class="actions"><button class="button primary" type="submit">保存</button>${server?`<button class="button" id="probe" type="button">保存后检测</button>`:''}</div></form></div>`}
    function render(){app.innerHTML=dashboard();document.querySelector('#refresh').onclick=()=>load().catch(showError);document.querySelector('#add').onclick=()=>openForm();document.querySelector('#servers-body').onclick=e=>{const edit=e.target.dataset.edit,open=e.target.dataset.open;if(edit)openForm(state.servers.find(s=>s.id===edit));if(open)window.open(`/servers/${encodeURIComponent(open)}/panel`,'_blank','noopener')};document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#servers-body tr[data-search]').forEach(row=>row.hidden=!!q&&!row.dataset.search.includes(q))}}
    function openForm(server){state.editing=server||null;app.insertAdjacentHTML('beforeend',form(server));const modal=document.querySelector('#modal');document.querySelector('#close').onclick=()=>modal.remove();document.querySelector('#server-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const input=Object.fromEntries(f.entries());input.port=Number(input.port);try{const result=await api(server?`/api/servers/${server.id}`:'/api/servers',{method:server?'PATCH':'POST',body:JSON.stringify(input)});modal.remove();await load();if(server&&document.querySelector('#probe')){} }catch(err){document.querySelector('#form-error').textContent=err.message}};const probe=document.querySelector('#probe');if(probe)probe.onclick=async()=>{try{probe.disabled=true;await api(`/api/servers/${server.id}/probe`,{method:'POST',body:'{}'});modal.remove();await load()}catch(err){document.querySelector('#form-error').textContent=err.message}finally{probe.disabled=false}}}
    function showError(error){app.innerHTML=`<div class="login"><div class="login-card"><h1>无法加载总站</h1><p>${esc(error.message||'请求失败')}</p><button class="button primary" onclick="location.reload()">重试</button></div></div>`}
    function login(){app.innerHTML=`<div class="login"><form class="login-card" id="login"><h1>RP Console</h1><p>总站管理登录</p><label class="field"><span>管理员密码</span><input name="password" type="password" autocomplete="current-password" required autofocus></label><div class="error" id="login-error"></div><button class="button primary" type="submit">登录</button></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const password=new FormData(e.currentTarget).get('password');try{await api('/api/login',{method:'POST',body:JSON.stringify({password})});load()}catch(err){document.querySelector('#login-error').textContent=err.message}}}
    const lineDate=value=>value?new Date(Number(value)*1000).toLocaleDateString('zh-CN'):'长期';
    function nodePanelRows(lines){if(!lines.length)return `<tr><td colspan="7"><div class="empty">该子站没有保存的 Relay Panel 线路。</div></td></tr>`;return lines.map(line=>`<tr><td>${esc(line.name||`线路 ${line.id}`)}</td><td>${esc(line.type||'-')}</td><td>${esc(line.status||'-')}</td><td>${esc(line.entryHost||'-')}${line.entryPort?`:${line.entryPort}`:''}</td><td class="validity"><div>起：${lineDate(line.validFrom)}</div><div>止：${lineDate(line.validUntil)}</div></td><td>${bytes(line.totalTraffic)}</td><td>${line.outboundLatencyMs?`${line.outboundLatencyMs} ms`:'-'}</td></tr>`).join('')}
    async function nodePanel(){const match=location.pathname.match(/^\/servers\/([^/]+)\/panel$/);if(!match)return load();const data=await api(`/api/servers/${encodeURIComponent(match[1])}/lines`);const server=data.server;app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><a class="name-link" href="/">RP Console</a><small>子站 RP：${esc(server.name)}</small></div><div class="actions"><button class="button" id="node-refresh">刷新线路</button></div></header><section class="panel"><div class="panel-head"><h1>${esc(server.name)} <span class="muted mono">${esc(server.address)}</span></h1><span title="${esc(statusText(server))}"><i class="dot ${esc(server.status)}"></i> ${esc(statusText(server))}</span></div><div class="panel-head"><h2>线路</h2><span class="muted">本站累计流量：${bytes(server.totalTraffic)}　管理延迟：${server.latencyMs?server.latencyMs+' ms':'-'}</span></div><table><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>入口</th><th>有效期</th><th>累计流量</th><th>出站延迟</th></tr></thead><tbody>${nodePanelRows(data.lines)}</tbody></table></section><section class="events"><div class="panel"><div class="panel-head"><h2>线路操作</h2></div><div class="empty">远程线路编辑、部署、分享和删除将在子站受控写接口完成后开放。</div></div><div class="panel"><div class="panel-head"><h2>访问边界</h2></div><div class="event-list"><div class="event">当前页面通过总站读取子站数据，浏览器未直接连接子站管理地址。</div><div class="event">子站线路有效期仍由子站 RP 本机处理。</div></div></div></section></div>`;document.querySelector('#node-refresh').onclick=()=>nodePanel().catch(showError)}
    const panelRoute=/^\/servers\/[^/]+\/panel$/.test(location.pathname);
    api('/api/session').then(()=>panelRoute?nodePanel():load()).catch(error=>error.message==='LOGIN_REQUIRED'?login():showError(error));
  </script>
</body>
</html>
